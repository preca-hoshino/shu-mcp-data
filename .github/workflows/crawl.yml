name: Crawl SHU News
run-name: 'crawl-${{ github.run_number }} ${{ github.event.inputs.mode || ''incremental'' }}'

on:
  schedule:
    # 每天 4 次：北京时间 09:00 / 12:00 / 16:00 / 20:00
    - cron: '0 1 * * *'
    - cron: '0 4 * * *'
    - cron: '0 8 * * *'
    - cron: '0 12 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: '爬取模式'
        required: true
        default: 'incremental'
        type: choice
        options:
          - incremental
          - full
      max_pages:
        description: '每栏目最大页数（0=不限，incremental 默认 3）'
        required: false
        default: '3'
        type: string

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Display run time
        run: |
          TZ='Asia/Shanghai' echo "## 🕘 北京时间: $(date '+%Y-%m-%d %H:%M:%S')" >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install ruff mypy pytest

      - name: Quality gate
        run: |
          ruff format --check .
          ruff check .
          mypy .
          pytest tests/ -q

      - name: Run crawler
        run: |
          MODE="${{ github.event.inputs.mode || 'incremental' }}"
          PAGES="${{ github.event.inputs.max_pages || '3' }}"
          python scheduler.py --no-progress -c 5 --mode "$MODE" -p "$PAGES"

      - name: Checkout data branch
        uses: actions/checkout@v4
        with:
          ref: data
          path: data-branch

      - name: Sync and push data branch
        run: |
          cp -f output/*.json data-branch/
          cd data-branch
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add *.json
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          TZ='Asia/Shanghai' DATE=$(date '+%Y-%m-%d %H:%M')
          git commit -m "[Chore](data): update news data ${DATE}"
          git push origin data
